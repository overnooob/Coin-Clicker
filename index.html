<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--surface:#fff;--ink:#23284a;--soft:#e8eefc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:'Fredoka','Trebuchet MS',Arial,sans-serif;font-weight:500;color:var(--ink);overflow:hidden}
#game{--bg1:#3aa655;--bg2:#55c070;height:100%;display:flex;flex-direction:column;background-color:var(--bg1);background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25%,transparent 75%,var(--bg2) 75%);background-size:80px 80px;background-position:0 0,40px 40px}
#game[data-world=candy]{--bg1:#ff7ac8;--bg2:#ff9fd8}#game[data-world=lava]{--bg1:#ff8a1f;--bg2:#ffa84d}#game[data-world=circus]{--bg1:#d9232b;--bg2:#f2484f}
#top{display:flex;justify-content:center;align-items:center;padding:12px;gap:10px;flex-wrap:wrap}
.pill{background:var(--surface);border-radius:30px;padding:8px 18px;font-weight:700;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.sq{width:48px;height:48px;border-radius:16px;border:none;font-size:24px;cursor:pointer;background:var(--surface);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.sq.off{opacity:.55}
#main{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:22px;padding:6px 12px;overflow:auto}
#coinWrap{text-align:center;position:relative}
#coin{width:min(44vw,220px);height:min(44vw,220px);border-radius:50%;border:none;cursor:pointer;font-size:min(22vw,110px);background:radial-gradient(circle at 35% 30%,#fff6a8,#ffc928 55%,#e69500);box-shadow:0 10px 0 #b36f00,0 16px 24px rgba(0,0,0,.3);transition:transform .08s}
#coin:active{transform:scale(.92) translateY(6px);box-shadow:0 4px 0 #b36f00}
#autoBtn{margin-top:22px}
#giftWrap{text-align:center;position:relative;display:none}
#gift{width:min(30vw,140px);height:min(30vw,140px);border-radius:50%;border:none;cursor:pointer;font-size:min(15vw,70px);background:radial-gradient(circle at 35% 30%,#e9d2ff,#a864f0 55%,#6f2fc2);box-shadow:0 8px 0 #4a1c8a,0 12px 18px rgba(0,0,0,.3);transition:transform .08s}
#gift:active{transform:scale(.92) translateY(6px);box-shadow:0 3px 0 #4a1c8a}
#gift.cd{filter:grayscale(.6);opacity:.75}
#giftInfo{position:absolute;top:-6px;right:-6px;width:40px;height:40px;font-size:20px;border-radius:14px;z-index:2;background:#a864f0;box-shadow:0 4px 0 #4a1c8a;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;text-align:center}#giftInfo:active{box-shadow:0 1px 0 #4a1c8a;transform:translateY(3px)}
#gsub{display:none;margin-top:14px;font-size:15px;padding:4px 12px}
.float{position:absolute;font-weight:700;font-size:28px;color:#fff;pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.card{background:var(--surface);border-radius:26px;padding:16px 18px;box-shadow:0 7px 0 rgba(0,0,0,.2)}
#eggBox,.eb{text-align:center;width:min(430px,92vw)}
#eggIcon{font-size:84px;line-height:1.1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#odds,.od{width:min(320px,92vw);font-size:15px}
#odds div.o,.od div.o{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{--sh:#23703a;border:none;border-radius:16px;padding:10px 16px;font:inherit;font-weight:700;font-size:17px;color:#fff;cursor:pointer;background:#3aa655;box-shadow:0 5px 0 var(--sh);transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--sh)}.sq:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.blue{background:#3b8dff;--sh:#1e56b0}.btn.red{background:#ee4b5a;--sh:#a02633}
.btn.gray{background:#8b90a8;--sh:#5d6178}.btn.orange{background:#ff9a1f;--sh:#b86500}
.btn:disabled{opacity:.5;cursor:not-allowed}
#dock{display:flex;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}
#dock .btn{font-size:20px;padding:12px 22px}
#modal{position:fixed;inset:0;background:rgba(15,20,60,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
#modal.show{display:flex}
#panel{background:var(--surface);border-radius:26px;width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25)}
#ph{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:#ffb62e;font-weight:700;font-size:24px;color:#4a2b00}
#pb{padding:14px;overflow:auto}
.row{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.row .ic{font-size:34px}.row .tx{flex:1}.row small{opacity:.75;display:block}
.bar{height:8px;border-radius:6px;background:rgba(0,0,0,.15);margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:#3aa655}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pet{border-radius:16px;padding:8px 4px;text-align:center;cursor:pointer;position:relative;border:4px solid transparent}
.pet .e{font-size:38px}.pet small{display:block;font-size:12px}
.pet.sel{border-color:#3b8dff}
.badge{position:absolute;top:2px;right:4px;font-size:14px}
.r-Common{background:#d9dce6;color:#23284a}.r-Uncommon{background:#bff0c4;color:#1e4d27}.r-Rare{background:#b8d6ff;color:#173a6e}.r-Epic{background:#e3c4ff;color:#47216e}.r-Secret{background:#ffd0d6;color:#7a1626}
.slots{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.slot{width:70px;height:70px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative;border:4px solid transparent}
.slot.sel{border-color:#3b8dff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none;width:min(92vw,420px)}.toast{background:#ee4b5a;color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;transform:translateY(-8px);transition:.25s;text-align:center;max-width:100%;word-break:break-word}.toast.show{opacity:1;transform:none}.toast.ann{background:#3b8dff;font-size:18px;padding:10px 20px}
#ov{position:fixed;inset:0;background:rgba(10,15,50,.78);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}
#ov.show{display:flex}
#oe{font-size:min(44vw,190px);line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
#oe.in{animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-70vh) scale(.5)}to{transform:none}}
#oe.shake{animation:shake var(--d,2s) ease-in-out forwards}
@keyframes shake{0%{transform:rotate(0) scale(1)}12%{transform:rotate(-14deg)}24%{transform:rotate(14deg)}36%{transform:rotate(-18deg) scale(1.08)}48%{transform:rotate(18deg) scale(1.1)}62%{transform:rotate(-22deg) scale(1.18)}76%{transform:rotate(22deg) scale(1.25)}90%{transform:rotate(-26deg) scale(1.35)}100%{transform:scale(1.6)}}
#o3{display:none;align-items:center;justify-content:center;gap:min(2vw,14px);width:100%;max-width:1000px;padding:0 6px}
#o3 .s3{display:flex;align-items:center;justify-content:center;flex:1;min-width:0}
#o3 .e3{font-size:min(30vw,170px);line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
#o3 .e3.shake{animation:shake var(--d,2s) ease-in-out forwards}
#o3 .r3{--rs:min(44vw,300px);display:flex;flex-direction:column;align-items:center;color:#fff;text-align:center;min-width:0;position:relative;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
#o3 .r3 .rays{position:absolute;width:var(--rs);height:var(--rs);top:50%;left:50%;margin:calc(var(--rs)/-2) 0 0 calc(var(--rs)/-2);background:repeating-conic-gradient(rgba(255,230,120,.5) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
#o3 .r3 .big{font-size:min(28vw,140px);position:relative}#o3 .r3 .nm{font-size:min(5.5vw,28px);font-weight:700;position:relative}#o3 .r3 .pill{font-size:min(3.6vw,15px);margin-top:6px;padding:2px 12px;position:relative}#o3 .r3 .adl{font-size:13px;margin-top:4px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
#flash.go{animation:fl .6s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#res{display:none;flex-direction:column;align-items:center;color:#fff;text-align:center;position:relative}
#res.show{display:flex;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
#res .rays{position:absolute;width:min(90vw,420px);height:min(90vw,420px);top:50%;left:50%;margin:calc(min(90vw,420px)/-2) 0 0 calc(min(90vw,420px)/-2);background:repeating-conic-gradient(rgba(255,230,120,.5) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.1) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
#res .big{font-size:min(36vw,150px);position:relative}
#res .nm{font-size:34px;font-weight:700;position:relative}
#acct{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 12px 0}
#odds div.o,.od div.o{cursor:pointer;border-radius:12px;padding:4px 6px}#odds div.o.ad,.od div.o.ad{background:rgba(238,75,90,.2)}
#cf{position:fixed;inset:0;background:rgba(10,15,50,.6);display:none;align-items:center;justify-content:center;z-index:40}#cf.show{display:flex}#cft{font-size:20px;font-weight:700;text-align:center;max-width:280px}
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px;background-color:#2f8cff;background-image:linear-gradient(45deg,#4aa0ff 25%,transparent 25%,transparent 75%,#4aa0ff 75%),linear-gradient(45deg,#4aa0ff 25%,transparent 25%,transparent 75%,#4aa0ff 75%);background-size:80px 80px;background-position:0 0,40px 40px}
#login .card{width:min(380px,100%);text-align:center}
.inp{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:3px solid var(--soft);background:var(--soft);color:var(--ink);margin-top:10px;user-select:text;-webkit-user-select:text}
#lerr{color:#ee4b5a;font-weight:700;margin-top:8px}#lerr:empty{display:none}
#login{overflow:hidden}
#login .card{position:relative;z-index:1;padding:26px 24px 24px;border-radius:32px}
#lcoin{font-size:54px;line-height:1.2}
#ltitle{font-size:30px;font-weight:700}
#ltabs{display:flex;gap:4px;background:var(--soft);border-radius:18px;padding:5px;margin-top:16px}
#ltabs .btn{flex:1;font-size:17px;background:transparent;color:var(--ink);box-shadow:none;opacity:.7}
#ltabs .btn:not(.gray){background:#ffc928;color:#4a2b00;opacity:1;box-shadow:0 3px 0 #b36f00}
#ltabs .btn:active:not(:disabled){box-shadow:none;transform:translateY(2px)}
.inp:focus{outline:none;border-color:#3b8dff;background:var(--surface)}
#lgo{font-size:20px;padding:13px 16px}
#bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:10px 12px}#bar #top,#bar #acct{padding:0}#bar #top{justify-content:flex-start}
.adl{position:relative;font-weight:700;font-size:18px;margin-top:8px}
.erow{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.eic{font-size:84px;line-height:1.1;animation:bob 2s ease-in-out infinite}
.r-Legendary{background:#ffe08a;color:#6b4a00}
.slot.r-Common{background:#d9dce6;color:#23284a}.slot.r-Uncommon{background:#bff0c4;color:#1e4d27}.slot.r-Rare{background:#b8d6ff;color:#173a6e}.slot.r-Epic{background:#e3c4ff;color:#47216e}.slot.r-Legendary{background:#ffe08a;color:#6b4a00}.slot.r-Secret{background:#ffd0d6;color:#7a1626}.row.me{outline:3px solid #3b8dff}
#upd{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border-radius:18px;padding:6px 14px;font-weight:700;font-size:14px;line-height:1.35;box-shadow:0 4px 0 rgba(0,0,0,.2);pointer-events:none}
@media (max-width:700px){#dock{padding-bottom:74px}}
#modal.rw{flex-direction:column;gap:12px}#modal.rw #panel{max-height:calc(100vh - 210px)}
</style></head>
<body>
<div id="game">
 <div id="bar"><div id="top"><button class="sq" id="snd" title="Sound">🔊</button><div class="pill" id="coins"></div><div class="pill" id="world" style="font-size:18px"></div></div><div id="acct"><button class="btn orange" id="adminBtn" style="display:none;padding:8px 14px;font-size:15px">🛡️Admin</button><button class="btn" id="chatBtn" style="padding:8px 14px;font-size:15px">💬 Chat</button><button class="btn blue" id="lbBtn" style="padding:8px 14px;font-size:15px">🏆 Leaderboard</button><span class="pill" id="nick" style="font-size:16px"></span><button class="btn red" id="logout" style="padding:8px 14px;font-size:15px">Log out</button></div></div>
 <div id="evs" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"></div>
 <div id="main">
  <div id="giftWrap"><button class="sq" id="giftInfo" aria-label="Gift info">ℹ️</button><button id="gift" aria-label="Gift">🎁</button><div><span class="pill" id="gsub"></span></div></div>
  <div id="coinWrap"><button id="coin" aria-label="Click the coin">🪙</button><div><button class="btn" id="autoBtn"></button></div></div>
  <div id="eggs" style="display:flex;flex-direction:column;gap:16px"><div class="erow"><div class="card" id="eggBox">
   <div style="font-weight:700;font-size:22px" id="eggName"></div>
   <div id="eggIcon">🥚</div>
   <div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="btn" id="hatch"></button><button class="btn" id="hatch3"></button><button class="btn gray" id="auto"></button></div>
  </div>
  <div class="card" id="odds"></div></div><div id="tiers" style="display:flex;flex-direction:column;gap:16px"></div></div>
 </div>
 <div id="dock">
  <button class="btn blue" data-p="tp">🌀 Teleport</button>
  <button class="btn orange" data-p="up">⬆️ Upgrades</button>
  <button class="btn red" data-p="inv">🎒 Pets</button>
 </div>
</div>
<div id="modal"><div id="rw" style="display:none"></div><div id="panel"><div id="ph"><span id="pt"></span><button class="btn red" id="close">✕</button></div><div id="pb"></div></div></div>
<div id="ov"><div id="o3"></div><div id="oe">🥚</div><div id="res"><div class="rays"></div><div class="big"></div><div class="nm"></div><div class="pill" style="font-size:16px;margin-top:8px;position:relative"></div><div class="adl"></div></div></div>

<div id="login"><div class="card"><div id="lcoin">🪙</div><div id="ltitle">Coin Clicker</div>
<div id="ltabs"><button class="btn" id="ltab1">Log in</button><button class="btn gray" id="ltab2">Register</button></div><input class="inp" id="lnick" placeholder="Nickname" maxlength="20" autocomplete="username"><input class="inp" id="lpass" type="password" placeholder="Password" maxlength="50" autocomplete="current-password">
<div id="lerr"></div><div style="margin-top:14px"><button class="btn blue" id="lgo" style="width:100%">Log in</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const RC={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4,Secret:5};
const PETS={
 cat:{n:'Cat',e:'🐱',r:'Common',p:.2},dog:{n:'Dog',e:'🐶',r:'Uncommon',p:.5},bunny:{n:'Bunny',e:'🐰',r:'Rare',p:1.2},
 ccat:{n:'Candy Cat',e:'😻',r:'Uncommon',p:3},cdog:{n:'Choclate Dog',e:'🐕',r:'Rare',p:6},lbun:{n:'Lolipop Bunny',e:'🍭',r:'Epic',p:14},over:{n:'Candy Overlord',e:'😈',r:'Secret',p:100},
 lcat:{n:'Lava Cat',e:'😾',r:'Uncommon',p:30},mdog:{n:'Magma Dog',e:'🐺',r:'Rare',p:60},fbun:{n:'Fire Bunny',e:'🐇',r:'Epic',p:140},ldrg:{n:'Lava Dragon',e:'🐉',r:'Legendary',p:400},phx:{n:'Phoenix',e:'🐦‍🔥',r:'Secret',p:2500},
 gir:{n:'Giraffe',e:'🦒',r:'Uncommon',p:300},bel:{n:'Ball Elephant',e:'🐘',r:'Rare',p:600},cmon:{n:'Circus Monkey',e:'🐵',r:'Epic',p:1400},ccl:{n:'Clown Cat',e:'🤡',r:'Legendary',p:4000},jest:{n:'Jester',e:'🃏',r:'Secret',p:25000}};
const EGGS={
 spawn:{n:'Basic Egg',e:'🥚',cost:100,loot:[['cat',60],['dog',30],['bunny',10]]},
 candy:{n:'Choclate Egg',e:'🍫',cost:2500,loot:[['ccat',60],['cdog',30],['lbun',9.97],['over',.03]]},
 lava:{n:'Magma Egg',e:'🔥',cost:40000,loot:[['lcat',55],['mdog',30],['fbun',13],['ldrg',1.98],['phx',.02]]},
 circus:{n:'Carnival Egg',e:'🎪',cost:400000,loot:[['gir',55],['bel',30],['cmon',13],['ccl',1.98],['jest',.02]]}};
const WORLDS={spawn:{n:'Spawn',e:'🌳',cost:0},candy:{n:'Candy',e:'🍬',cost:4000},lava:{n:'Lava',e:'🌋',cost:100000},circus:{n:'Circus',e:'🎪',cost:1000000}};
const TIERS={huge:{n:'Huge',m:1.3,cost:3},titan:{n:'Titanic',m:1.6,cost:6}};
const STORAGE=[100,150,200,250,300,350,400];
const hatchTime=l=>2600-l*200;
const autoRate=l=>1+l*.5;
const UP={
 clicks:{n:'Coins',e:'🪙',max:30,cost:l=>Math.round(20*Math.pow(1.5,l)),d:l=>`+${l+1} base coins per click`},
 luck:{n:'Luck',e:'🍀',max:25,cost:l=>Math.round(150*Math.pow(1.7,l)),d:l=>`Rare pets +${l*5}% more likely`},
 equips:{n:'Pet Equips',e:'🐾',max:3,cost:l=>[8000,80000,800000][l],d:l=>`${3+l} equip slots`},
 storage:{n:'Storage',e:'📦',max:6,cost:l=>Math.round(500*Math.pow(3,l)),d:l=>`Holds ${STORAGE[l]} pets`},
 auto:{n:'Auto Clicker Speed',e:'🤖',max:12,cost:l=>Math.round(200*Math.pow(1.8,l)),d:l=>`${autoRate(l)} auto clicks / sec`},
 hatch:{n:'Hatch Speed',e:'⚡',max:8,cost:l=>Math.round(300*Math.pow(2.6,l)),d:l=>`Hatch takes ${(hatchTime(l)/1000).toFixed(1)}s`}};
const S={coins:0,world:'spawn',unlocked:{spawn:1},up:{clicks:0,luck:0,equips:0,storage:0,auto:0,hatch:0},pets:[],uid:1,auto:'',autoClick:true,busy:false,in:false,autoDel:{},autoDelH:{},autoDelT:{},ev:{},tier:{huge:null,titan:null},sel:new Set(),multi:false,gift:null,giftCd:0,pb:{}};
let chatData=[],chatInit=false,chatSeen=0,chatLast=0,LBdata=null,LBerr='',LBmode='coins',autoWait=0,panel=null,autoAcc=0,music=true,sound=true;
const slots=()=>3+S.up.equips, cap=()=>STORAGE[S.up.storage];
const equipped=()=>S.pets.filter(p=>p.eq);
const pw=p=>PETS[p.t].p*(p.titan?TIERS.titan.m:p.huge?TIERS.huge.m:1), pn=p=>(p.titan?'Titanic ':p.huge?'Huge ':'')+PETS[p.t].n;
const adMap=k=>k=='huge'?S.autoDelH:k=='titan'?S.autoDelT:S.autoDel;
const kind=p=>p.titan?2:p.huge?1:0;
